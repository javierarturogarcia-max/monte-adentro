# Publicacion en GitHub Pages.
#
# El sitio es estatico y sin dependencias: se publica el repositorio tal cual,
# asi que el juego queda en <usuario>.github.io/<repo>/ y el archivo unico en
# <usuario>.github.io/<repo>/dist/monte-adentro.html
#
# Se lanza solo en cada empuje a main, y tambien a mano desde la pestana
# Actions. Antes de publicar corre las pruebas: si el juego esta roto, no se
# sube.
#
# ANTES DEL PRIMER USO hay que activar Pages a mano, una sola vez:
#   Settings -> Pages -> Source: GitHub Actions
# No se puede automatizar. El GITHUB_TOKEN del flujo tiene `pages: write`, que
# sirve para PUBLICAR, pero CREAR el sitio pide permisos de administracion del
# repositorio que ese token nunca tiene: falla con "Create Pages site failed:
# Resource not accessible by integration". Una vez activado, esto ya va solo
# para siempre.
#
# Todas las rutas del juego son relativas (./src, ./assets), asi que funciona
# igual servido desde <usuario>.github.io/monte-adentro/ que desde la raiz.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  publicar:
    name: Publicar
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Si Pages ya esta activado, este paso solo lo consulta y sigue. Si
          # no lo esta, intenta crearlo y falla (ver la nota de arriba): la
          # primera activacion es manual. Se deja en true porque no estorba y
          # porque funciona si algun dia se lanza con un token con permisos.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: despliegue
        uses: actions/deploy-pages@v4
