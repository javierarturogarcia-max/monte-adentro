# Publicacion en GitHub Pages.
#
# El sitio es estatico y sin dependencias: se publica el repositorio tal cual,
# asi que el juego queda en <usuario>.github.io/<repo>/ y el archivo unico en
# <usuario>.github.io/<repo>/dist/monte-adentro.html
#
# Se lanza solo en cada empuje a main, y tambien a mano desde la pestana
# Actions. Antes de publicar corre las pruebas: si el juego esta roto, no se
# sube.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  publicar:
    name: Publicar
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Activa Pages por API si todavia no lo esta, para no tener que ir a
          # Settings a mano. Necesita el permiso `pages: write` de arriba.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: despliegue
        uses: actions/deploy-pages@v4
